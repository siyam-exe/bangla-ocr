[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bangla-ocr"
version = "1.2.0"
description = "Bengali OCR for scanned Bangla PDFs, books, and documents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["bengali", "bangla", "ocr", "document-preservation", "surya"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
  "Flask>=3.1,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.11,<5",
  "Pillow>=12.3,<13",
  "pypdf>=6,<7",
  "pypdfium2>=5.12.1,<6",
  "rapidfuzz>=3.14,<4",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
easyocr = ["easyocr==1.7.2"]
dev = ["build>=1.2,<2", "pytest>=8,<10"]

[project.scripts]
bangla-ocr = "bangla_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bangla_ocr = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
