name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Check repository release hygiene
        run: python scripts/release_check.py
      - name: Compile source
        run: python -m compileall -q src tests benchmarks scripts
      - name: Run tests
        run: python -m pytest -q
      - name: Build package
        run: python -m build
