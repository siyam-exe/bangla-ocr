name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Surya and project dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install surya-ocr==0.22.1
          python -m pip install --upgrade ".[easyocr,dev]" pip-audit
      - name: Check dependency consistency
        run: python scripts/check_dependencies.py --allow-surya-pillow-override
      - name: Audit known vulnerabilities
        run: python -m pip_audit --local --skip-editable
